<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="forgot.doc">Forgot Password | Bloom Maternal Care</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/verify.css">
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/accessibility.js"></script>
</head>
<body>

  <header class="app-header">
    <button class="back-btn" id="backBtn" type="button" aria-label="Go back to log in" data-i18n-aria="forgot.backAria">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <img class="header-logo" src="assets/images/logo.png" alt="Bloom logo">
    <div class="header-text">
      <span class="brand">Bloom Maternal Care</span>
      <span class="page-title" data-i18n="forgot.page">Forgot Password</span>
    </div>
  </header>

  <main class="auth-main">
    <div class="logo-circle">
      <img src="assets/images/logo.png" alt="Bloom logo">
    </div>

    <span class="badge">
      <span class="material-symbols-outlined">spa</span>
      <span data-i18n="common.badge">Care for Every Trimester</span>
    </span>

    <h1 data-i18n="forgot.title">Forgot Your Password?</h1>
    <p class="subtitle" data-i18n="forgot.subtitle">
      Enter the email you registered with and we will send you a 6-digit code to reset your password.
    </p>

    <form class="auth-card" id="forgotForm" novalidate>
      <div class="field">
        <label for="email"><span data-i18n="auth.email">Email Address</span> <span class="required">*</span></label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input type="email" id="email" placeholder="Enter your email" data-i18n-placeholder="auth.emailPh" autocomplete="email">
        </div>
      </div>

      <p class="form-error" id="formError" role="alert"></p>

      <button type="submit" class="btn-primary" id="sendBtn">
        <span data-i18n="forgot.send">Send Code</span>
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </form>

    <p class="auth-footer-text" data-i18n="forgot.remembered">Remembered your password?</p>
    <a href="login.html" class="btn-secondary">
      <span class="material-symbols-outlined">login</span>
      <span data-i18n="forgot.backToLogin">Back to Log In</span>
    </a>
  </main>

  <script src="js/forgot.js"></script>
</body>
</html>
