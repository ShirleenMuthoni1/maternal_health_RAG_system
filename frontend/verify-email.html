<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="verify.doc">Verify Email | Bloom Maternal Care</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/verify.css">
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/accessibility.js"></script>
</head>
<body>

  <header class="app-header">
    <button class="back-btn" id="backBtn" type="button" aria-label="Go back" data-i18n-aria="auth.back">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <img class="header-logo" src="assets/images/logo.png" alt="Bloom logo">
    <div class="header-text">
      <span class="brand">Bloom Maternal Care</span>
      <span class="page-title" data-i18n="verify.page">Verify Email</span>
    </div>
  </header>

  <main class="auth-main">
    <div class="logo-circle">
      <img src="assets/images/logo.png" alt="Bloom logo">
    </div>

    <span class="badge">
      <span class="material-symbols-outlined">spa</span>
      <span data-i18n="common.badge">Care for Every Trimester</span>
    </span>

    <h1 data-i18n="verify.title">Check Your Email</h1>
    <p class="subtitle">
      <span data-i18n="verify.sent">We sent a 6-digit code to</span> <span class="email-shown" id="emailShown"></span><span data-i18n="verify.sentEnd">. Enter it below to verify your account.</span>
    </p>

    <form class="auth-card" id="verifyForm" novalidate>
      <div class="field">
        <label for="code"><span data-i18n="verify.codeLabel">Verification Code</span> <span class="required">*</span></label>
        <input type="text" id="code" class="code-input" inputmode="numeric"
               maxlength="6" autocomplete="one-time-code" placeholder="000000">
      </div>

      <p class="form-error" id="formError" role="alert"></p>
      <p class="form-success" id="formSuccess" role="status"></p>

      <button type="submit" class="btn-primary" id="verifyBtn">
        <span data-i18n="verify.button">Verify</span>
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>

      <div class="resend-row">
        <span data-i18n="verify.noCode">Did not get a code?</span>
        <!-- The text of this button is set by verify.js (it shows the countdown) -->
        <button type="button" class="link-btn" id="resendBtn">Resend code</button>
        <p class="spam-hint" data-i18n="verify.spam">The email can take a minute. Please also check your spam folder.</p>
      </div>
    </form>
  </main>

  <script src="js/verify.js"></script>
</body>
</html>
