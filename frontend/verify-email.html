<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | Bloom Maternal Care</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/verify.css">
</head>
<body>

  <header class="app-header">
    <button class="back-btn" id="backBtn" type="button" aria-label="Go back">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <img class="header-logo" src="assets/images/logo.png" alt="Bloom logo">
    <div class="header-text">
      <span class="brand">Bloom Maternal Care</span>
      <span class="page-title">Verify Email</span>
    </div>
  </header>

  <main class="auth-main">
    <div class="logo-circle">
      <img src="assets/images/logo.png" alt="Bloom logo">
    </div>

    <span class="badge">
      <span class="material-symbols-outlined">spa</span>
      Care for Every Trimester
    </span>

    <h1>Check Your Email</h1>
    <p class="subtitle">
      We sent a 6-digit code to <span class="email-shown" id="emailShown"></span>.
      Enter it below to verify your account.
    </p>

    <form class="auth-card" id="verifyForm" novalidate>
      <div class="field">
        <label for="code">Verification Code <span class="required">*</span></label>
        <input type="text" id="code" class="code-input" inputmode="numeric"
               maxlength="6" autocomplete="one-time-code" placeholder="000000">
      </div>

      <p class="form-error" id="formError" role="alert"></p>
      <p class="form-success" id="formSuccess" role="status"></p>

      <button type="submit" class="btn-primary" id="verifyBtn">
        Verify
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>

      <div class="resend-row">
        Did not get a code?
        <button type="button" class="link-btn" id="resendBtn">Resend code</button>
        <p class="spam-hint">The email can take a minute. Please also check your spam folder.</p>
      </div>
    </form>
  </main>

  <script src="js/verify.js"></script>
</body>
</html>
