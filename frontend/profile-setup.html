<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Setup | Bloom Maternal Care</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/guard.js"></script>
</head>
<body>

  <header class="app-header">
    <button class="back-btn" id="backBtn" type="button" aria-label="Go back">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <img class="header-logo" src="assets/images/logo.png" alt="Bloom logo">
    <div class="header-text">
      <span class="brand">Bloom Maternal Care</span>
      <span class="page-title">Profile Setup</span>
    </div>
  </header>

  <main class="auth-main">
    <div class="logo-circle">
      <img src="assets/images/logo.png" alt="Bloom logo">
    </div>

    <span class="badge">
      <span class="material-symbols-outlined">spa</span>
      Care for Every Trimester
    </span>

    <h1>Set Up Your Profile</h1>
    <p class="subtitle">
      Tell us a little about your pregnancy journey and health background so we can tailor the best care for you.
    </p>

    <form class="auth-card" id="profileForm" novalidate>
      <div class="card-header-row">
        <span class="step-title">
          <span class="step-number">2</span>
          Step 2: Health &amp; Context Profile
        </span>
        <span class="required-tag">Required *</span>
      </div>

      <div class="field">
        <label for="gestationalAge">Gestational Age / Weeks <span class="required">*</span></label>
        <div class="input-wrap">
          <select id="gestationalAge">
            <option value="">Select number of weeks</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>
      </div>

      <div class="field">
        <label for="location">Location / City <span class="required">*</span></label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">location_on</span>
          <select id="location" class="has-icon">
            <option value="">Select your city</option>
            <option>Nairobi, Kenya</option>
            <option>Mombasa, Kenya</option>
            <option>Kisumu, Kenya</option>
            <option>Nakuru, Kenya</option>
            <option>Eldoret, Kenya</option>
            <option>Thika, Kenya</option>
            <option>Machakos, Kenya</option>
            <option>Nyeri, Kenya</option>
            <option>Meru, Kenya</option>
            <option>Kakamega, Kenya</option>
            <option>Garissa, Kenya</option>
            <option>Other</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>
      </div>

      <div class="field">
        <label for="symptoms">Current Symptoms</label>
        <textarea id="symptoms" placeholder="Describe any nausea, fatigue, cramps, back pain, or physical changes you are currently experiencing..."></textarea>
      </div>

      <div class="field">
        <label for="medicalHistory">Medical History</label>
        <textarea id="medicalHistory" placeholder="Any pre-existing conditions we should know about..."></textarea>
      </div>

      <p class="form-error" id="formError" role="alert"></p>

      <button type="submit" class="btn-primary">
        Save and Continue
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </form>
  </main>

  <script src="js/profile.js"></script>
</body>
</html>
