<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Bloom Maternal Care</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="app-header">
    <button class="back-btn" id="backBtn" type="button" aria-label="Go back">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <img class="header-logo" src="assets/images/logo.png" alt="Bloom logo">
    <div class="header-text">
      <span class="brand">Bloom Maternal Care</span>
      <span class="page-title">Log In</span>
    </div>
  </header>

  <main class="auth-main">
    <div class="logo-circle">
      <img src="assets/images/logo.png" alt="Bloom logo">
    </div>

    <span class="badge">
      <span class="material-symbols-outlined">spa</span>
      Care for Every Trimester
    </span>

    <h1>Welcome Back</h1>

    <form class="auth-card" id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email Address <span class="required">*</span></label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="password">Password <span class="required">*</span></label>
          <a href="forgot-password.html" class="small-link">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-password" data-target="password" aria-label="Show or hide password">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <p class="form-error" id="formError" role="alert"></p>

      <button type="submit" class="btn-primary">
        Log In
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </form>

    <p class="auth-footer-text">Don't have an account?</p>
    <a href="register.html" class="btn-secondary">
      <span class="material-symbols-outlined">person_add</span>
      Create an Account
    </a>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
