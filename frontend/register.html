<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="auth.regDoc">Create Account | Bloom Maternal Care</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/accessibility.js"></script>
</head>
<body>

  <header class="app-header">
    <button class="back-btn" id="backBtn" type="button" aria-label="Go back" data-i18n-aria="auth.back">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <img class="header-logo" src="assets/images/logo.png" alt="Bloom logo">
    <div class="header-text">
      <span class="brand">Bloom Maternal Care</span>
      <span class="page-title" data-i18n="auth.regPage">Create Account</span>
    </div>
  </header>

  <main class="auth-main">
    <div class="logo-circle">
      <img src="assets/images/logo.png" alt="Bloom logo">
    </div>

    <span class="badge">
      <span class="material-symbols-outlined">spa</span>
      <span data-i18n="common.badge">Care for Every Trimester</span>
    </span>

    <h1 data-i18n="auth.regTitle">Create Your Account</h1>
    <p class="subtitle" data-i18n="auth.regSubtitle">
      A gentle, caring space to nurture and support you throughout your pregnancy and motherhood journey.
    </p>

    <form class="auth-card" id="registerForm" novalidate>
      <p class="step-label" data-i18n="auth.step1">Step 1: Mama Profile</p>

      <div class="field">
        <label for="email"><span data-i18n="auth.email">Email Address</span> <span class="required">*</span></label>
        <div class="input-wrap">
          <input type="email" id="email" class="no-icon" placeholder="Enter your email" data-i18n-placeholder="auth.emailPh" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="password"><span data-i18n="auth.password">Password</span> <span class="required">*</span></label>
          <span class="hint" data-i18n="auth.pwHint">At least 8 characters</span>
        </div>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input type="password" id="password" placeholder="Create a password" data-i18n-placeholder="auth.createPh" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="password" aria-label="Show or hide password" data-i18n-aria="auth.toggle">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword"><span data-i18n="auth.confirm">Confirm Password</span> <span class="required">*</span></label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">lock_reset</span>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" data-i18n-placeholder="auth.confirmPh" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show or hide password" data-i18n-aria="auth.toggle">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <p class="form-error" id="formError" role="alert"></p>

      <button type="submit" class="btn-primary">
        <span data-i18n="auth.continueReg">Continue Registration</span>
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </form>

    <p class="auth-footer-text" data-i18n="auth.haveAccount">Already have an account?</p>
    <a href="login.html" class="btn-secondary">
      <span class="material-symbols-outlined">login</span>
      <span data-i18n="auth.loginLink">Log in to Bloom</span>
    </a>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
