<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&amp;A Consultation | Bloom Maternal Care</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/chat.css">
  <script src="js/guard.js"></script>
</head>
<body>

  <header class="app-header">
    <button class="back-btn" id="backBtn" type="button" aria-label="Back to dashboard">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <img class="header-logo" src="assets/images/logo.png" alt="Bloom logo">
    <div class="header-text">
      <span class="brand">Bloom Maternal Care</span>
      <span class="page-title">Q&amp;A Consultation</span>
    </div>
  </header>

  <main class="chat-main">

    <section class="context-card" aria-label="Your context information">
      <div class="context-head">
        <div class="context-title">
          <span class="context-icon">
            <span class="material-symbols-outlined">pregnant_woman</span>
          </span>
          <div>
            <h2>Context Information</h2>
            <p>Your answers are tailored to these details</p>
          </div>
        </div>
      </div>

      <div class="context-chips">
        <div class="chip">
          <span class="chip-icon">
            <span class="material-symbols-outlined">calendar_month</span>
          </span>
          <div>
            <small>Gestational age</small>
            <strong id="ctxWeeks">Not set</strong>
          </div>
        </div>

        <div class="chip">
          <span class="chip-icon">
            <span class="material-symbols-outlined">spa</span>
          </span>
          <div>
            <small>Trimester</small>
            <strong id="ctxTrimester">Not set</strong>
          </div>
        </div>

        <div class="chip pink">
          <span class="chip-icon">
            <span class="material-symbols-outlined">location_on</span>
          </span>
          <div>
            <small>Location</small>
            <strong id="ctxLocation">Not set</strong>
          </div>
        </div>
      </div>

      <p class="context-empty" id="contextEmpty" hidden>
        Complete your profile to get answers that fit you.
        <a href="profile-setup.html">Set up profile</a>
      </p>
    </section>

    <section class="messages" id="messages" aria-live="polite"></section>
  </main>

  <div class="chat-input-bar">
    <form id="chatForm" autocomplete="off">
      <input type="text" id="questionInput" placeholder="Type your maternal health question..." aria-label="Your question">
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send question">
        <span class="material-symbols-outlined">send</span>
      </button>
    </form>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
